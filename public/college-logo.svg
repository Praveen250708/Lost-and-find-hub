<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="50%" stop-color="#FDA085" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#0f2b48" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Academic Shield Background -->
  <path d="M100 25 C135 25 160 38 160 70 C160 115 125 155 100 172 C75 155 40 115 40 70 C40 38 65 25 100 25 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Sun rays / Knowledge glow -->
  <circle cx="100" cy="65" r="18" fill="#FEF3C7" opacity="0.3"/>

  <!-- Flaming Torch of Knowledge -->
  <path d="M96 52 C96 46 100 42 100 42 C100 42 104 46 104 52 C104 56 101 58 100 60 C99 58 96 56 96 52 Z" fill="#EF4444"/>
  <path d="M98 54 C98 50 100 47 100 47 C100 47 102 50 102 54 C102 56 101 57 100 58 C99 57 98 56 98 54 Z" fill="#F59E0B"/>
  <path d="M94 62 L106 62 L103 80 L97 80 Z" fill="#D97706"/>

  <!-- Open Book of Learning -->
  <path d="M100 88 C93 84 82 83 72 85 L72 107 C82 105 93 106 100 110 C107 106 118 105 128 107 L128 85 C118 83 107 84 100 88 Z" 
        fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="100" y1="88" x2="100" y2="110" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Gear / Technology Wheel Symbol -->
  <g transform="translate(100, 132) scale(0.65)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
    <rect x="-3" y="-23" width="6" height="6" fill="#F59E0B" rx="1"/>
    <rect x="-3" y="17" width="6" height="6" fill="#F59E0B" rx="1"/>
    <rect x="-23" y="-3" width="6" height="6" fill="#F59E0B" rx="1"/>
    <rect x="17" y="-3" width="6" height="6" fill="#F59E0B" rx="1"/>
    <rect x="-17" y="-17" width="6" height="6" fill="#F59E0B" rx="1" transform="rotate(45)"/>
    <rect x="11" y="-17" width="6" height="6" fill="#F59E0B" rx="1" transform="rotate(45)"/>
    <rect x="-17" y="11" width="6" height="6" fill="#F59E0B" rx="1" transform="rotate(45)"/>
    <rect x="11" y="11" width="6" height="6" fill="#F59E0B" rx="1" transform="rotate(45)"/>
  </g>

  <!-- Banner for SMVEC -->
  <path d="M50 162 Q100 178 150 162 L155 174 Q100 190 45 174 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1"/>
  <text x="100" y="173" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#0f2b48" text-anchor="middle" letter-spacing="2">SMVEC</text>

  <!-- Top Curved Text: SRI MANAKULA VINAYAGAR -->
  <path id="curveTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="'DM Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#0f2b48" letter-spacing="1.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      SRI MANAKULA VINAYAGAR
    </textPath>
  </text>
</svg>
